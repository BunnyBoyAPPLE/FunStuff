<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Comic 1 — Page 3</title>

<style>
    body {
        margin: 0;
        background: #050010;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
        color: white;
    }

    /* ⭐ CSS STARFIELD */
    .starfield {
        position: fixed;
        inset: 0;
        z-index: -5;
        pointer-events: none;
        overflow: hidden;
    }

    .starfield::before,
    .starfield::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(2px 2px at 20% 30%, #ffffff, transparent),
            radial-gradient(1px 1px at 80% 70%, #ffffff, transparent),
            radial-gradient(2px 2px at 50% 90%, #ffffff, transparent),
            radial-gradient(1px 1px at 10% 50%, #ffffff, transparent),
            radial-gradient(2px 2px at 70% 20%, #ffffff, transparent),
            radial-gradient(1px 1px at 40% 80%, #ffffff, transparent),
            radial-gradient(2px 2px at 90% 40%, #ffffff, transparent);
        opacity: 0.6;
        animation: starDrift 40s linear infinite;
    }

    .starfield::after {
        opacity: 0.3;
        animation-duration: 70s;
    }

    @keyframes starDrift {
        from { transform: translateY(0); }
        to { transform: translateY(2000px); }
    }

    /* Grid */
    .grid {
        position: fixed;
        width: 100%;
        height: 100%;
        background: linear-gradient(#0ff2, #0ff2),
                    linear-gradient(90deg, #0ff2, #0ff2);
        background-size: 40px 40px;
        opacity: 0.05;
        z-index: -1;
    }

    /* Comic container */
    .comic-frame {
        margin: 40px auto;
        width: 90%;
        max-width: 900px;
        padding: 20px;
        border: 4px solid #0ff;
        border-radius: 20px;
        box-shadow: 0 0 25px #0ff, 0 0 50px #0ff inset;
        background: #0008;
    }

    .comic-frame img {
        width: 100%;
        border-radius: 10px;
    }

    /* Navigation */
    .nav-buttons {
        text-align: center;
        margin-top: 20px;
    }

    .nav-buttons a {
        padding: 12px 25px;
        background: #0ff;
        color: #000;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        box-shadow: 0 0 15px #0ff;
        transition: 0.2s;
        margin: 0 10px;
    }

    .nav-buttons a:hover {
        background: #0aa;
        box-shadow: 0 0 25px #0ff;
    }
</style>
</head>

<body>
<div class="starfield"></div>
<div class="grid"></div>

<div class="comic-frame">
    <img src="comics/comic1/comic1-page3.png" alt="Comic Page 3">
</div>

<div class="nav-buttons">
    <a href="comic1-page2.html">← Previous Page</a>
    <a href="comics.html">Back to Comics</a>
</div>

<script>
document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowLeft") {
        window.location.href = "comic1-page2.html";
    }
    if (e.key === "ArrowRight") {
        window.location.href = "comics.html";
    }
});
</script>

</body>
</html>
